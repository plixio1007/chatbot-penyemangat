name: Reminder Upload

on:
  schedule:
    - cron: '7 12 * * *' # 19.07 WIB
  workflow_dispatch:

jobs:
  kirim:
    runs-on: ubuntu-latest
    environment: DISCORD_WEBHOOK
    steps:
      - uses: actions/checkout@v4
      - run: node send.mjs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}